# The wall on Fly.io: one small machine that sleeps when nobody is
# visiting, and a volume at /data for the decks and their pictures.
#
#   fly launch --no-deploy --copy-config --name <your-app> --region ams
#   fly volumes create data --region ams --size 1 --yes
#   fly secrets set OWNER_EMAIL=you@example.com
#   fly deploy --ha=false
#
# Put your app's name in `app` and in BASE_URL before the first deploy.

app = "your-wall"
primary_region = "ams"
# the picture resizer needs headroom on a big photo; this is the safety net
swap_size_mb = 512

[env]
  BASE_URL = "https://your-wall.fly.dev"
  SIGNUP = "open"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
