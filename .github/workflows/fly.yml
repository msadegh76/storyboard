# The wall deployed from GitHub, so the upload to Fly's builder runs on
# GitHub's line rather than yours. Needs one repository secret,
# FLY_API_TOKEN, made with `fly tokens create deploy -x 999999h`.
name: Deploy to Fly
on:
  push:
    branches: [main, feat/hosted-wall]
  workflow_dispatch:
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
